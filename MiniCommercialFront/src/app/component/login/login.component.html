<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        <h3 class="text-center mb-4 fw-bold text-primary">Connexion Admin</h3>
        <div *ngIf="error" class="alert alert-danger">{{error}}</div>
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" formControlName="email" class="form-control" placeholder="admin@test.com">
          </div>
          <div class="mb-4">
            <label class="form-label">Mot de passe</label>
            <input type="password" formControlName="password" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loginForm.invalid">Se connecter</button>
        </form>
        
        <div class="mt-3 text-center">
          <small>Pas encore de compte ? <a routerLink="/register">S'inscrire</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
