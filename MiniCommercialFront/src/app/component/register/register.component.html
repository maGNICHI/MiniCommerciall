<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow border-0">
      <div class="card-body p-4">
        <h3 class="text-center mb-4 fw-bold text-primary">Créer un compte Admin</h3>

        <!-- Messages d'alerte -->
        <div *ngIf="errorMessage" class="alert alert-danger">{{errorMessage}}</div>
        <div *ngIf="successMessage" class="alert alert-success">{{successMessage}}</div>
        
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
          <!-- Nom d'utilisateur -->
          <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <input type="text" formControlName="username" class="form-control" 
                   [ngClass]="{'is-invalid': registerForm.get('username')?.touched && registerForm.get('username')?.invalid}">
            <div class="invalid-feedback">Le nom d'utilisateur est requis (min 3 car.).</div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email Professionnel</label>
            <input type="email" formControlName="email" class="form-control"
                   [ngClass]="{'is-invalid': registerForm.get('email')?.touched && registerForm.get('email')?.invalid}">
            <div class="invalid-feedback">Veuillez entrer un email valide.</div>
          </div>

          <!-- Mot de passe -->
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" formControlName="password" class="form-control"
                   [ngClass]="{'is-invalid': registerForm.get('password')?.touched && registerForm.get('password')?.invalid}">
            <div class="invalid-feedback">Le mot de passe doit faire au moins 6 caractères.</div>
          </div>

          <!-- Confirmation -->
          <div class="mb-4">
            <label class="form-label">Confirmer le mot de passe</label>
            <input type="password" formControlName="confirmPassword" class="form-control"
                   [ngClass]="{'is-invalid': (registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.invalid) || registerForm.errors?.['passwordMismatch']}">
            <div class="invalid-feedback" *ngIf="registerForm.errors?.['passwordMismatch']">
              Les mots de passe ne correspondent pas.
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="registerForm.invalid || loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            Créer mon compte
          </button>
        </form>
        
        <div class="mt-3 text-center">
          <small>Déjà un compte ? <a routerLink="/login">Se connecter ici</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
